<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我也會地震預測</title>
    <meta
      name="description"
      content="輸入一則地震預言，看看隨便亂猜有多容易中。用中央氣象署 31 年的地震目錄，算出「就算亂猜也會中」的機率。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="我也會地震預測" />
    <meta property="og:description" content="輸入一則地震預言，看看隨便亂猜有多容易中。" />
    <script>
      // 在畫面出來前先套上次選的主題與版面，重新整理時才不會閃一下預設配色（完整邏輯見 src/app/prefs.ts）
      try {
        var p = JSON.parse(localStorage.getItem('i-can-predict-quakes.prefs') || '{}');
        if (/^(auto|light|dark|desert|jungle|tech)$/.test(p.theme)) document.documentElement.dataset.theme = p.theme;
        if (/^(single|wide)$/.test(p.layout)) document.documentElement.dataset.layout = p.layout;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>這個網站要開啟 JavaScript 才能計算（所有計算都在你的瀏覽器裡完成）。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
